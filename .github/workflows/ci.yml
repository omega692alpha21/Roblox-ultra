name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rojo, luau, luau-lsp)
        run: |
          mkdir -p ~/tools && cd ~/tools
          curl -sL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -o rojo.zip
          curl -sL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.653/luau-ubuntu.zip
          unzip -o luau.zip
          curl -sL -o luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/latest/download/luau-lsp-linux-x86_64.zip
          unzip -o luau-lsp.zip
          chmod +x rojo luau luau-lsp
          curl -sL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          echo "$HOME/tools" >> "$GITHUB_PATH"

      - name: Rojo build
        run: rojo build default.project.json -o build.rbxl

      - name: Static analysis
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions="$HOME/tools/globalTypes.d.luau" \
            --sourcemap=sourcemap.json --no-strict-dm-types \
            $(find src -name "*.luau")

      - name: Unit tests
        run: LUAU="$HOME/tools/luau" tests/run.sh

      - name: HUD zones
        run: python3 tools/hud_zonecheck.py

      - name: Wiring
        run: python3 tools/wiring_check.py

      - name: Per-player state
        run: python3 tools/leak_check.py

      - name: Content
        run: python3 tools/content_check.py
